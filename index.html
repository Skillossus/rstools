<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory Setups viewer</title>
<link rel="stylesheet" href="style.css">
</head><body>
<h1>Inventory Setups viewer</h1>

<div id="loader">
  <div id="drop">
    <p>Drop your exported <code>.json</code> here, or paste it below. Nothing is uploaded; it all stays in your browser.</p>
    <textarea id="paste" placeholder="Paste exported Inventory Setups JSON, or a bank tag string" spellcheck="false"></textarea>
    <div class="bar">
      <button id="load">Load pasted data</button>
      <label class="btn">Choose file<input id="file" type="file" accept=".json,application/json,text/plain" multiple hidden></label>
    </div>
    <p class="hint">Leave it empty and press Load to see an example.</p>
  </div>
</div>
<div id="msg"></div>

<div id="app" class="hidden">
  <input id="q" type="search" placeholder="Search (Enter opens the first match)" autocomplete="off">
  <div id="count"></div>
  <div class="bar"><button id="again">Load different data</button></div>
  <div id="list"></div>
</div>

<footer>
  <span>Item icons &copy; Jagex, rendered from the OSRS game cache. <span id="ver"></span></span>
  <a id="problem" class="hidden" target="_blank" rel="noopener">problem?</a>

</footer>

<script src="example.js"></script>

</body></html>
