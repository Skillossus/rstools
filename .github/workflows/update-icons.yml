name: Update icons

# Modelled on RuneProfile's "Update Game Data" workflow (update-icons job):
#  - gated on OpenRS2, because the Java renderer needs a full binary disk store (.dat2/.idx)
#  - OpenRS2 can take hours to finish crawling a fresh cache, so we check several times a day
#  - the "processed" marker (icons/version.json) is only written after everything succeeded,
#    so a failed or too-early run simply retries on the next schedule
on:
  schedule:
    # Game updates land at 11:30 UK time (10:30 or 11:30 UTC). Later runs catch slow OpenRS2 crawls.
    - cron: "31 11 * * *"
    - cron: "31 12 * * *"
    - cron: "31 16 * * *"
    - cron: "31 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Re-render even if the newest cache was already processed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-icons
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A no-change run costs one HTTP request. Downloads disk.zip only when there is a new cache.
      - name: Check OpenRS2 for a new cache
        id: check
        run: python3 scripts/check_cache.py check --download "$RUNNER_TEMP/osrs-cache" ${{ inputs.force && '--force' || '' }}

      # RuneProfile's renderer (scripts/item-icons). CHECK ITS LICENSE before relying on this, and
      # replace `main` with a commit SHA so an upstream change cannot silently break the build.
      - name: Checkout renderer
        if: steps.check.outputs.new == 'true'
        uses: actions/checkout@v4
        with:
          repository: ReinhardtR/runeprofile
          ref: main
          path: renderer
          sparse-checkout: scripts/item-icons

      # Their workflow notes the renderer is Gradle 6.6.1, which supports at most Java 15.
      - name: Setup Java
        if: steps.check.outputs.new == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      # UNVERIFIED: I have not seen the renderer's build file. This assumes the Gradle `application`
      # plugin (`./gradlew run`) and positional args `<cacheDir> <outDir>`, which is what the Java
      # source's usage text suggested. Adjust to whatever scripts/item-icons actually exposes.
      - name: Render icons
        if: steps.check.outputs.new == 'true'
        working-directory: renderer/scripts/item-icons
        run: |
          test -f ./gradlew || { echo "No gradlew in scripts/item-icons; fix this step" >&2; exit 1; }
          chmod +x ./gradlew
          mkdir -p "$GITHUB_WORKSPACE/build/icons"
          ./gradlew run --args="${{ steps.check.outputs.cache_dir }} $GITHUB_WORKSPACE/build/icons"

      # Item id -> name map for hover text. Non-fatal: icons still ship if this step breaks
      # (the viewer then shows "Item <id>"). Reuses the renderer's Gradle project and its
      # -PmainClass override; tools/DumpItemNames.java is dropped into its source tree first.
      - name: Dump item names
        if: steps.check.outputs.new == 'true'
        continue-on-error: true
        working-directory: renderer/scripts/item-icons
        run: |
          cp "$GITHUB_WORKSPACE/tools/DumpItemNames.java" src/main/java/com/runeprofile/itemicons/
          ./gradlew run -PmainClass=com.runeprofile.itemicons.DumpItemNames \
            --args="${{ steps.check.outputs.cache_dir }} $GITHUB_WORKSPACE/build/names.json"

      # Refuse to replace good icons with a broken render (none, or far fewer than last time).
      - name: Verify render
        if: steps.check.outputs.new == 'true'
        run: python3 scripts/check_cache.py verify --new build/icons

      - name: Merge icons and record version
        if: steps.check.outputs.new == 'true'
        run: |
          mkdir -p icons
          cp -a build/icons/. icons/
          if [ -s build/names.json ]; then cp build/names.json icons/names.json
          else echo "::warning::No item names were produced; hover text will show item ids."; fi
          python3 scripts/check_cache.py record \
            --cache-id "${{ steps.check.outputs.cache_id }}" \
            --build "${{ steps.check.outputs.build }}" \
            --stamp "${{ steps.check.outputs.stamp }}"

      - name: Commit icons
        if: steps.check.outputs.new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          git diff --cached --quiet || git commit -m "Icons from OSRS cache ${{ steps.check.outputs.cache_id }} (rev${{ steps.check.outputs.build }})"
          git push

      - name: Publish self-contained viewer
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: cache-${{ steps.check.outputs.cache_id }}
        run: |
          python3 scripts/build_release.py . icons setups-viewer.html
          gh release create "$TAG" setups-viewer.html \
            --title "OSRS cache rev${{ steps.check.outputs.build }} (${{ steps.check.outputs.stamp }})" \
            --notes "Single-file viewer with every item icon embedded. Open it in a browser; no server needed." \
            || gh release upload "$TAG" setups-viewer.html --clobber
